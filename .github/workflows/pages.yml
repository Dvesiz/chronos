name: Deploy Chronos官网与在线体验 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/app _site/img
          # 产品官网占根路径
          cp -R site/. _site/
          # 在线体验版挂在 /app/，与官网共用同一套静态资源
          cp -R app/src/main/assets/www/. _site/app/
          cp -R docs/img/. _site/img/
          cp docs/img/logo.svg _site/logo.svg
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
