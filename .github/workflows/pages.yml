name: Deploy Chronos官网与在线体验 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run regression tests
        working-directory: backend
        run: |
          npm ci
          npm run test:all
      - name: Install Playwright for sync E2E
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Run sync browser E2E
        run: |
          python -m http.server 8899 --bind 127.0.0.1 --directory app/src/main/assets/www >/tmp/chronos-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          python tests/e2e/sync-e2e.py

      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/app _site/img
          # 产品官网占根路径
          cp -R site/. _site/
          # 在线体验版挂在 /app/，与官网共用同一套静态资源
          cp -R app/src/main/assets/www/. _site/app/
          cp -R docs/img/. _site/img/
          cp docs/img/logo.svg _site/logo.svg
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
